name: Deploy contracts (manual)

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network"
        required: true
        type: choice
        options:
          - testnet
          - mainnet

permissions:
  contents: write    # to push the updated packages/config/<network>.ts file
  pull-requests: write  # to open the PR with new addresses

concurrency:
  group: contracts-deploy-${{ github.event.inputs.network }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.network }}
    runs-on: ubuntu-latest
    environment:
      # Requires the matching environment to exist in repo settings.
      # Use Required reviewers on `mainnet` to gate manual approval.
      name: ${{ github.event.inputs.network }}
    env:
      MNEMONIC: ${{ secrets.DEPLOYER_MNEMONIC }}
      NEXT_PUBLIC_APP_ENV: ${{ github.event.inputs.network }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Compile contracts
        run: yarn contracts:compile

      - name: Deploy to ${{ github.event.inputs.network }}
        env:
          NETWORK: ${{ github.event.inputs.network }}
        run: yarn workspace @b3tr-testnet-faucet/contracts "deploy:$NETWORK"

      - name: Open PR with new addresses
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/deploy-${{ github.event.inputs.network }}-${{ github.run_id }}
          title: "chore: update ${{ github.event.inputs.network }} contract addresses"
          body: |
            Auto-generated from `Deploy contracts (manual)` workflow.

            - Network: `${{ github.event.inputs.network }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          commit-message: "chore: update ${{ github.event.inputs.network }} contract addresses"
          add-paths: |
            packages/config/testnet.ts
            packages/config/mainnet.ts
