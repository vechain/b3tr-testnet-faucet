name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "packages/config/**"
      - "packages/contracts/**"
      - "package.json"
      - "yarn.lock"
      - "turbo.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Least-privilege: only Pages deployment needs write
permissions:
  contents: read
  pages: write
  id-token: write

# A new push cancels any in-flight deploy so latest main wins
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    env:
      # Read by the static export at build time. testnet is the public network.
      NEXT_PUBLIC_NETWORK: test
      NEXT_PUBLIC_APP_ENV: testnet
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (frontend + contracts compile)
        env:
          # Pages serves under /<repo-name>; passed via env so it isn't interpolated into shell.
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          export NEXT_PUBLIC_BASE_PATH="/$REPO_NAME"
          yarn build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/frontend/out

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
